name: Validate Pages

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: test -f index.html
      - run: npx --yes html-validate index.html
      - run: test -z "$(grep -RIl '<script[^>]*src=\"http://' . --include='*.html' || true)"
